name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security problems, please don't use this form; see the security link on the previous page.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you're using.
  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04, Firefox 140
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots or files that help explain the problem.
